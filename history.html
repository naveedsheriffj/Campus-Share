<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner History - CampusShare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <nav class="navbar navbar-app">
            <div class="nav-brand">
                <h1>CampusShare</h1>
            </div>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="marketplace.html" class="nav-link">Marketplace</a>
                <a href="seller-requests.html" class="nav-link">Seller Requests</a>
                <a href="my-requests.html" class="nav-link">My Requests</a>
                <a href="planner.html" class="nav-link">Smart Planner</a>
                <a href="history.html" class="nav-link active">History</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <button id="logoutBtn" class="btn btn-outline">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <div class="history-header">
                <h2>Planner History</h2>
                <p class="history-subtitle">View your saved resource plans</p>
            </div>

            <div id="historyList" class="history-list">
                <p class="loading-text">Loading history...</p>
            </div>

            <div id="emptyHistory" class="empty-state" style="display: none;">
                <div class="empty-icon">📋</div>
                <h3>No Saved Plans</h3>
                <p>You haven't saved any resource plans yet.</p>
                <a href="planner.html" class="btn btn-primary">Create a Plan</a>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
