<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusShare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <nav class="navbar">
            <div class="nav-brand">
                <h1>CampusShare</h1>
            </div>
            <div class="nav-links">
                <a href="index.html" class="btn btn-outline">Home</a>
                <a href="register.html" class="btn btn-primary">Register</a>
            </div>
        </nav>

        <main class="auth-main">
            <div class="auth-card">
                <h2>Login</h2>
                <p class="auth-subtitle">Access your CampusShare account</p>
                
                <button id="googleLoginBtn" class="btn btn-outline btn-full" style="margin-bottom: 1rem;">
                    <span style="margin-right: 0.5rem;">G</span> Continue with Google
                </button>
                
                <div style="text-align: center; margin: 1rem 0; color: #6b7280;">or</div>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="your.email@college.edu">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                    
                    <div id="loginError" class="error-message"></div>
                </form>
                
                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Register</a></p>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
